[build-system]
requires = ["setuptools >= 42.0",
    "setuptools_scm[toml] >= 6.2",
    "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xs2arr"
authors = [
    {name = "Andrew Gibson"}
]
description = "Calculates Arrhenius coefficients from a provided cross section"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lmfit>=1.3.3",
    "lxcat-data-parser@git+https://github.com/avadean/lxcat_data_parser",
    "numpy>=2.0.0",
    "pandas>=2.3.0",
]
dynamic = ["version"]

[project.scripts]
xs2arr = "xs2arr.main:run"

[project.optional-dependencies]
tests = [
    "hypothesis>=6.135.16",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "syrupy>=4.9.1",
]
lint = [
    "ruff>=0.12.0",
]
jupyter = [
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.3",
    "pygments>=2.19.2",
]

[tool.setuptools_scm]

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear
  "I",   # isort
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "ICN", # flake8-import-conventions
  "G",   # flake8-logging-format
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "YTT", # flake8-2020
  "EXE", # flake8-executable
  "NPY", # NumPy specific rules
  "PD",  # pandas-vet
]
ignore = [
  "PLR2004", # magic-comparison
  "B9",      # flake8-bugbear opinionated warnings
]
